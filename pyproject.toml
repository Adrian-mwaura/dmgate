[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmgate"
version = "0.0.1"
description = "Agent data minimization via model-rule fusion (Huawei Challenge 5)"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-bash>=0.23",
  "sqlglot>=30.22,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
dmgate-eval = "dmgate.harness:main"
dmgate-llm-eval = "dmgate.llm.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]